# dsh-session-manager —— DSH bundle patch
#
# 本文件是插件的“挂载声明”。DSH 启动时按 bundle 层栈叠加各插件 patch，
# 这一行把插件的 Host 半段（lib/index.js）挂进 profile 的配置树；
# 浏览器半段（client.js）由 package.json 的 `dsh.client` 声明自动加载。
#
# 安装：plugin_manager install_bundle（target 指向本目录绝对路径）。
- insert:
    - id: dsh-session-manager
      name: dsh-session-manager
