<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="dsh-session-manager">
  <defs>
    <linearGradient id="dsm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="dsm-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe6ff"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#dsm-bg)"/>

  <!-- 会话气泡（左上角小徽标） -->
  <g opacity=".92">
    <rect x="12" y="12" width="19" height="14" rx="5" fill="#ffffff" fill-opacity=".28"/>
    <path d="M17 26v5l5-5z" fill="#ffffff" fill-opacity=".28"/>
    <circle cx="17.4" cy="19" r="1.7" fill="#ffffff" fill-opacity=".95"/>
    <circle cx="21.6" cy="19" r="1.7" fill="#ffffff" fill-opacity=".95"/>
    <circle cx="25.8" cy="19" r="1.7" fill="#ffffff" fill-opacity=".95"/>
  </g>

  <!-- 垃圾桶：盖 + 桶身 + 两道蓝槽 -->
  <rect x="32.5" y="13" width="19" height="5" rx="2.5" fill="#ffffff"/>
  <rect x="35" y="20" width="14" height="32" rx="4.5" fill="url(#dsm-body)"/>
  <rect x="38.4" y="25.5" width="2.8" height="19" rx="1.4" fill="#6d7dff"/>
  <rect x="43.6" y="25.5" width="2.8" height="19" rx="1.4" fill="#6d7dff"/>
</svg>
