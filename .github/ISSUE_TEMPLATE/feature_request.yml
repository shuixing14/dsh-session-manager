name: Feature request
description: 想要的新能力 / 改进
title: '[feat] '
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 现在哪里不方便？例如「会话太多，逐条点太慢」
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望怎么做
      description: 描述期望的界面或行为；如果涉及删除，请说明对「备份 / 守卫」的影响
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你现在是怎么绕过这个问题的？
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 这个需求不要求删除**当前会话**或正在运行的会话（这些默认被拒绝）
          required: false
